<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올해네컷 — 1년 치 사진 속 가장 빛난 순간, 네컷으로</title>
<meta name="description" content="고르지 않아도, 올해가 네컷으로. 사계절·열두 달·테마별로 올 한 해를 결산해요. 사진은 폰 밖으로 나가지 않아요.">
<meta property="og:title" content="올해네컷 — 올 한 해 하이라이트, 네컷으로 결산">
<meta property="og:description" content="고르지 않아도, 올해가 네컷으로. 광고도, 서버도 없어요.">
<meta property="og:image" content="https://twinfamily-4cuts.github.io/year4cuts/img/og.png">
<meta property="og:url" content="https://twinfamily-4cuts.github.io/year4cuts/">
<meta property="og:type" content="website">
<link rel="icon" href="img/icon.png">
<style>
  :root { --ink: #16181B; --sub: #8E9196; --line: #ECECEC; --soft: #F5F5F6; --pink: #F0507A; --violet: #8B5CF6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: #fff; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 22px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header b { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
  h1 { font-size: 30px; line-height: 1.32; font-weight: 900; letter-spacing: -1px; margin-top: 18px; }
  .lead { color: var(--sub); font-size: 15.5px; line-height: 1.6; margin-top: 10px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .pills span { font-size: 12.5px; font-weight: 700; padding: 7px 11px; border-radius: 999px; background: var(--soft); }
  .cta { display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; font-weight: 800; font-size: 15.5px; text-decoration: none; margin-top: 16px; }
  .cta.pink { background: var(--pink); color: #fff; box-shadow: 0 10px 24px rgba(240,80,122,.28); }
  .cta.line { border: 1.5px solid var(--line); color: var(--ink); margin-top: 10px; }
  .cta small { font-weight: 600; font-size: 12px; color: var(--sub); margin-left: 6px; }
  /* 화면 세 장: 가로 스크롤 캐러셀 */
  .shots { display: flex; gap: 12px; margin: 26px -22px 0; padding: 4px 22px 2px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .shots::-webkit-scrollbar { display: none; }
  .shots figure { flex: 0 0 auto; width: 60vw; max-width: 220px; scroll-snap-align: center; }
  .shots img { display: block; width: 100%; height: auto; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 16px 34px rgba(0,0,0,.10); }
  .shots figcaption { margin-top: 8px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--sub); }
  /* 기능 3줄 */
  .points { margin-top: 22px; display: grid; gap: 8px; }
  .points div { font-size: 15px; line-height: 1.5; font-weight: 600; padding: 12px 15px; background: var(--soft); border-radius: 14px; }
  .note { margin-top: 10px; font-size: 12.5px; line-height: 1.6; color: var(--sub); text-align: center; }
  footer { margin-top: 28px; font-size: 12px; color: var(--sub); text-align: center; line-height: 1.8; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="img/icon.png" alt=""><b>올해네컷</b></header>

  <h1>1년 치 사진 속<br>가장 빛난 순간, 네컷으로</h1>
  <p class="lead">고르지 않아도, 올해가 네컷으로.</p>
  <div class="pills"><span>🔒 사진은 폰 밖으로 안 나가요</span><span>서버·로그인 없음</span></div>
  <!-- 버튼은 아래 스크립트가 기기(안드로이드·아이폰·그 밖)와 출시 단계(LINKS)에 맞춰 채운다 -->
  <div id="ctas"><a class="cta pink" href="https://forms.gle/bKaRi3YmqS2c777r5" target="_blank" rel="noopener">출시 알림 받기</a></div>
  <p class="note" id="note" hidden></p>

  <!-- 화면 세 장: 가로 스크롤( scroll-snap ) 캐러셀 -->
  <div class="shots">
    <figure><img src="img/home.webp" alt="올해네컷 홈 화면 — 봄·여름·가을·겨울로 골라진 네컷 카드" width="720" height="1280"><figcaption>네컷</figcaption></figure>
    <figure><img src="img/months.webp" alt="올해네컷 열두 달 화면 — 1월부터 12월까지 한 장씩 고른 사진" width="720" height="1280"><figcaption>열두 달</figcaption></figure>
    <figure><img src="img/share.webp" alt="올해네컷 공유 화면 — 모양·바탕·캡션 고르기" width="720" height="1280"><figcaption>공유</figcaption></figure>
  </div>

  <!-- 기능 3줄 -->
  <div class="points">
    <div>사계절 네컷 — 계절마다 가장 좋은 한 장</div>
    <div>열두 달·함께한 사람·다녀온 곳·맛있었던 것</div>
    <div>마음에 안 들면 ↻ 다시 뽑기</div>
  </div>

  <footer>
    <a href="privacy.html">개인정보 처리방침</a> · <a href="terms.html">이용약관</a> · 문의 <a href="mailto:twincouplefamily@gmail.com">twincouplefamily@gmail.com</a>
  </footer>
</div>

<script>
  // 출시 단계에 맞춰 여기 주소만 바꾼다. 비어 있는 값은 쓰지 않는다.
  const LINKS = {
    android: '',   // Play 스토어 주소 — 정식 출시 후 채우면 안드로이드는 [Google Play에서 받기]
    ios: '',       // App Store 주소 — 출시 후 채우면 아이폰은 [App Store에서 받기]
    betaGroup: '', // 베타 테스터 Google 그룹 주소 — 채우면 안드로이드는 [그룹 가입] → [테스트 참여] 두 단계
    betaPlay: 'https://play.google.com/apps/testing/com.hyosang.year4cuts', // Play 비공개 테스트 참여 주소
    form: 'https://forms.gle/bKaRi3YmqS2c777r5', // 출시 알림·베타 신청 구글 폼
  };
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const btn = (href, text, cls) => `<a class="cta ${cls}" href="${href}" target="_blank" rel="noopener">${text}</a>`;
  function androidButtons(cls, prefix) {
    if (LINKS.android) return [btn(LINKS.android, prefix + 'Google Play에서 받기', cls)];
    if (LINKS.betaGroup) return [
      btn(LINKS.betaGroup, prefix + '① 베타 그룹 가입하기', cls),
      btn(LINKS.betaPlay, prefix + '② 베타 테스트 참여하기', 'line'),
    ];
    return [btn(LINKS.form, prefix + '베타 테스트 신청하기', cls)];
  }
  function iosButtons(cls) {
    if (LINKS.ios) return [btn(LINKS.ios, 'App Store에서 받기', cls)];
    return [btn(LINKS.form, isIOS ? '출시 알림 받기' : '아이폰 출시 알림 받기', cls)];
  }
  let html = [], note = '';
  if (isAndroid) {
    html = androidButtons('pink', '');
    if (!LINKS.android && LINKS.betaGroup) note = '그룹에 가입한 구글 계정으로 ②를 열어 주세요.';
  } else if (isIOS) {
    html = iosButtons('pink');
    if (!LINKS.ios) note = '아이폰 버전은 준비 중이에요. 나오면 가장 먼저 알려 드릴게요.';
  } else {
    html = androidButtons('pink', LINKS.android ? '' : '안드로이드 · ').concat(iosButtons('line'));
  }
  document.getElementById('ctas').innerHTML = html.join('');
  if (note) { const n = document.getElementById('note'); n.textContent = note; n.hidden = false; }
</script>
</body>
</html>
